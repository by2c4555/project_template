# Project Template v4.1.2 — human-editable local runtime model configuration
#
# 1) In VS Code: Chat -> Manage Language Models
# 2) Find each model and record its model ID, VS Code model/display name,
#    vendor, and context size from the Language Models editor/details.
# 3) Edit the values below.
# 4) Run:
#      python scripts/configure_models.py
#      python scripts/validate_v4.py
#
# model_id          = provider/API identifier (recorded for provenance)
# vscode_model_name = exact model name registered/displayed by VS Code
# vendor            = VS Code vendor/provider identifier
# context           = documented/VS Code-reported context-window capacity
#
# The .agent.md model pin is generated as:
#   VS Code Model Name (vendor)
#
# Do not put API keys or secrets in this file.

[manager]
model_id = CHANGE_ME
vscode_model_name = CHANGE_ME
vendor = CHANGE_ME
context = 512000

[builder]
model_id = CHANGE_ME
vscode_model_name = CHANGE_ME
vendor = CHANGE_ME
context = 102400
